<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body{margin:0;background:#1a1a1f;display:flex;justify-content:center;gap:20px;padding:16px 0}
      iframe{width:390px;height:780px;border:0;border-radius:14px;background:#08090d}
    </style>
  </head>
  <body>
    <iframe id="a" src="/#/tic-tac-toe"></iframe>
    <iframe id="b" src="/#/tic-tac-toe"></iframe>
    <script>
      function autoplay(frame, marks) {
        frame.addEventListener('load', () => {
          const doc = frame.contentDocument;
          const waitFor = (selector, done) => {
            const el = doc.querySelector(selector);
            if (el) done(el);
            else setTimeout(() => waitFor(selector, done), 120);
          };
          waitFor('.mode-row', (firstMode) => {
            firstMode.click();
            waitFor('.start-button:not(:disabled)', (start) => {
              start.click();
              waitFor('.cell', () => {
                marks.forEach((index) => {
                  const cell = doc.querySelectorAll('.cell')[index];
                  if (cell && !cell.disabled) cell.click();
                });
              });
            });
          });
        });
      }
      autoplay(document.getElementById('a'), [4, 0, 8]);
      autoplay(document.getElementById('b'), [4, 2, 6]);
    </script>
  </body>
</html>
